name: cursos

services:
  postgres:
    image: postgres:16
    container_name: cursos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cursosdb
    ports:
      # 5433 no host para não conflitar com outro PostgreSQL na 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cursosdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
